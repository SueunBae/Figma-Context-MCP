name: Daily HCI Papers

on:
  schedule:
    - cron: '0 0 * * *' # KST 09:00 (UTC 00:00)
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  send-papers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests anthropic

      - name: Fetch and post daily papers
        run: python scripts/daily-papers/fetch_papers.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Commit updated sent_papers.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/daily-papers/sent_papers.json
          git diff --staged --quiet || git commit -m "chore: update sent papers log [skip ci]"
          git push
